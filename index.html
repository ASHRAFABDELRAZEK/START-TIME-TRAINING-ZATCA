<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14573A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="description" content="محاكي تدريبي مستقل من START TIME ACADEMY — ليس موقع هيئة الزكاة والضريبة والجمارك">
<title>محاكي الإقرارات الضريبية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@600;700&display=swap">
<style>
/* الألوان مأخوذة من تصميم موقع هيئة الزكاة والضريبة والجمارك (أخضر #1B8354) */
:root{
  --bg:#F9FAFB; --surface:#ffffff; --surface-2:#F3F4F6; --line:#D2D6DB; --line-2:#E5E7EB;
  --fg:#161616; --head:#1F2A37; --muted:#4D5761; --faint:#6C737F;
  --accent:#1B8354; --accent-hover:#166A45; --accent-ink:#ffffff; --accent-soft:#F3FCF6; --acc2:#166A45;
  --link:#1B8354; --ink2:#1F2A37;
  --head-bg:#0F1C34; --head-fg:#ffffff; --head-muted:#b9c7de;
  --ac1:#62B34F; --ac2:#4FBBBD; --ac3:#0996D4; --ac4:#2053A4;
  --amber:#DBA102; --red:#D92D20; --c-gold:#DBA102; --c-lav:#80519F; --c-blue:#1570EF; --c-slate:#384250;
  --ok:#067647; --ok-soft:#ECFDF3; --ok-solid:#1B8354;
  --warn:#93370D; --warn-soft:#FFFAEB; --bad:#B42318; --bad-soft:#FEF3F2;
  --input:#ffffff; --input-line:#9DA4AE; --calc:#F3F4F6; --calc-line:#D2D6DB;
  --tab-on-bg:#0D121C; --tab-on-fg:#ffffff; --foot-bg:#074D31;
  --focus:#1570EF; --shadow:0 2px 4px rgba(16,24,40,.06),0 4px 8px rgba(16,24,40,.10);
  --radius:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D121C; --surface:#111927; --surface-2:#1F2A37; --line:#384250; --line-2:#2A3441;
  --fg:#F3F4F6; --head:#ffffff; --muted:#9DA4AE; --faint:#6C737F;
  --accent:#54C08A; --accent-hover:#88D8AD; --accent-ink:#092A1E; --accent-soft:#104631; --acc2:#88D8AD;
  --link:#54C08A; --ink2:#E5E7EB;
  --head-bg:#0a1223; --head-fg:#eef3fb; --head-muted:#9fb0cc;
  --amber:#F5BD02; --red:#F97066; --c-gold:#F5BD02; --c-lav:#A57BBA; --c-blue:#53B1FD; --c-slate:#6C737F;
  --ok:#75E0A7; --ok-soft:#053321; --ok-solid:#25935F;
  --warn:#FDB022; --warn-soft:#3a2a08; --bad:#F97066; --bad-soft:#55160C;
  --input:#111927; --input-line:#6C737F; --calc:#1F2A37; --calc-line:#384250;
  --tab-on-bg:#F3F4F6; --tab-on-fg:#0D121C; --foot-bg:#053321;
  --focus:#53B1FD; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D121C; --surface:#111927; --surface-2:#1F2A37; --line:#384250; --line-2:#2A3441;
  --fg:#F3F4F6; --head:#ffffff; --muted:#9DA4AE; --faint:#6C737F;
  --accent:#54C08A; --accent-hover:#88D8AD; --accent-ink:#092A1E; --accent-soft:#104631; --acc2:#88D8AD;
  --link:#54C08A; --ink2:#E5E7EB;
  --head-bg:#0a1223; --head-fg:#eef3fb; --head-muted:#9fb0cc;
  --amber:#F5BD02; --red:#F97066; --c-gold:#F5BD02; --c-lav:#A57BBA; --c-blue:#53B1FD; --c-slate:#6C737F;
  --ok:#75E0A7; --ok-soft:#053321; --ok-solid:#25935F;
  --warn:#FDB022; --warn-soft:#3a2a08; --bad:#F97066; --bad-soft:#55160C;
  --input:#111927; --input-line:#6C737F; --calc:#1F2A37; --calc-line:#384250;
  --tab-on-bg:#F3F4F6; --tab-on-fg:#0D121C; --foot-bg:#053321;
  --focus:#53B1FD; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:14px;line-height:1.6;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--link)}
.num,.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--head-bg);color:var(--head-fg)}
.topbar-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;margin-inline-end:auto}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:none;background:conic-gradient(from 200deg,var(--ac1),var(--ac2),var(--ac3),var(--ac4),var(--ac1));display:grid;place-items:center}
.brand-mark span{width:26px;height:26px;border-radius:7px;background:var(--head-bg);color:#fff;font:700 11px/26px "IBM Plex Sans Arabic",sans-serif;text-align:center;letter-spacing:.02em}
.en{font-family:"IBM Plex Sans","IBM Plex Sans Arabic","Segoe UI",sans-serif;letter-spacing:.05em;direction:ltr;unicode-bidi:isolate}
.brand h1{font-size:16px;margin:0;line-height:1.3;font-weight:700}
.brand small{display:block;color:var(--head-muted);font-size:12px;font-weight:500}
.brand small b{color:var(--head-fg);font-weight:600;letter-spacing:.04em}
.badge-train{font-size:11px;font-weight:600;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:1px 9px;color:var(--amber);white-space:nowrap}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tools select,.tools .tbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:var(--head-fg);border-radius:8px;padding:5px 10px;font-size:13px}
.tools select option{color:#1b2738;background:#fff}
.tools .tbtn:hover{background:rgba(255,255,255,.16)}
.tools .tbtn[aria-pressed="true"]{background:var(--ac2);border-color:var(--ac2);color:#06292c;font-weight:600}
.strip{height:4px;background:linear-gradient(90deg,var(--ac4),var(--ac3),var(--ac2),var(--ac1))}

/* ---------- journey ---------- */
.journey{background:var(--surface);border-bottom:1px solid var(--line)}
.journey ol{list-style:none;margin:0;padding:10px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:thin}
@media (min-width:1100px){.journey ol{flex-wrap:wrap}}
.journey li{flex:none}
.jbtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px 4px 6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.jbtn i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--fg);font-size:12px;font-weight:700}
.jbtn.done i{background:var(--ok-solid);color:#fff}
.jbtn.cur{border-color:var(--accent);color:var(--fg);background:var(--accent-soft);font-weight:600}
.jbtn.cur i{background:var(--accent);color:var(--accent-ink)}

/* ---------- layout: إطار الموقع + لوحة شرح جانبية خارج الإطار ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding-block:16px 28px;padding-inline:16px;max-width:1500px;margin:0 auto;align-items:start}
.sitefrm{min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;overflow:clip}
.frm-bar{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
.frm-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:inline-block}
.frm-bar span{flex:1;text-align:center;direction:ltr;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{min-width:0;padding:16px}
body.fullbleed main{padding:0}
aside.panel{position:sticky;top:calc(env(safe-area-inset-top,0px) + 78px);align-self:start;max-height:calc(100vh - 100px);overflow:auto;background:var(--surface);border:2px solid var(--accent);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel-tag{display:block;padding:6px 14px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:600;letter-spacing:.02em}
.panel-h{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.panel-h h3{margin:0;font-size:14px;flex:1;color:var(--head)}
.panel-b{padding:12px 14px 16px}
.panel-x{display:none;border:0;background:none;font-size:20px;line-height:1;color:var(--muted)}
.fab-help{display:none}
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  aside.panel{position:fixed;inset:auto 0 0 0;top:auto;max-height:72vh;border-radius:16px 16px 0 0;z-index:60;transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  aside.panel.open{transform:none}
  .panel-x{display:block}
  .fab-help{display:flex;position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;border:0;border-radius:999px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:var(--shadow)}
  .frm-bar{display:none}
}

/* ---------- generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.card-h h2{font-size:17px;margin:0;text-wrap:balance}
.card-b{padding:16px 18px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:7px 16px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.green{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.green:hover{background:var(--accent-hover)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:12.5px}
.linkbtn{border:0;background:none;color:var(--link);padding:0;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.gray{background:var(--calc);color:var(--muted)}
.note{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:9px 12px;border-radius:6px;font-size:13px}
.note.warn{border-color:var(--amber);background:var(--warn-soft)}
.note.bad{border-color:var(--red);background:var(--bad-soft)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 18px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--input-line);background:var(--input);border-radius:6px;padding:7px 10px}
.fld input[readonly]{background:var(--calc);border-color:var(--calc-line)}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line-2);text-align:start;vertical-align:middle}
.tbl th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:12.5px;white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:left;direction:ltr;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;background:var(--surface-2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--surface-2)}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{font-size:18px;direction:ltr;display:block;text-align:right;font-variant-numeric:tabular-nums}
.kpi.hl{border-color:var(--accent);background:var(--accent-soft)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-inline-end:4px;border:1px solid}
.lg-in{background:var(--input);border-color:var(--input-line)!important}
.lg-calc{background:var(--calc);border-color:var(--calc-line)!important}
.lg-sch{background:var(--accent-soft);border-color:var(--accent)!important}

/* ---------- portal-like return ---------- */
.ret-head{display:flex;flex-wrap:wrap;gap:6px 22px;padding:12px 18px;background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.ret-head div span{color:var(--muted);margin-inline-end:6px}
.stepper{display:flex;gap:0;overflow-x:auto;padding:16px 10px 10px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.st{flex:1 0 78px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;border:0;background:none;padding:0 4px;color:var(--muted);font-size:11.5px;text-align:center}
.st::before{content:"";position:absolute;top:17px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.st:first-child::before{display:none}
.st .c{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);font-weight:700;position:relative;z-index:1;font-size:13px}
.st.done .c{background:var(--ok-solid);border-color:var(--ok-solid);color:#fff}
.st.done::before,.st.cur::before{background:var(--ok-solid)}
.st.cur .c{background:var(--acc2);border-color:var(--acc2);color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--acc2) 22%,transparent)}
.st.cur{color:var(--fg);font-weight:600}
.st.na{opacity:.45}
.st.na .c{border-style:dashed}
.st.err .c{border-color:var(--red);color:var(--red)}
.step-title{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:14px 18px 6px}
.step-title h2{margin:0;font-size:17px}
.rows{padding:4px 10px 14px}
.row{display:grid;grid-template-columns:58px minmax(0,1fr) 150px 190px 30px;gap:8px;align-items:center;padding:7px 8px;border-bottom:1px dashed var(--line-2)}
.row:hover{background:var(--surface-2)}
.row.sel{background:var(--accent-soft)}
.row .code{font-weight:700;color:var(--acc2);font-variant-numeric:tabular-nums;font-size:13px}
.row .lbl{min-width:0}
.row .lbl b{font-weight:500}
.row .hint{display:none;font-size:12px;color:var(--muted);margin-top:2px}
body.explain .row .hint{display:block}
.row.tot .lbl b{font-weight:700}
.row.tot .out{font-weight:700;border-color:var(--accent);background:var(--accent-soft)}
.row.grand .out{font-size:15px;background:var(--acc2);color:#fff;border-color:var(--acc2)}
.row.h{grid-template-columns:1fr;background:var(--surface-2);border-radius:6px;border:0;margin-top:10px;font-weight:700;color:var(--head)}
.amt{width:100%;direction:ltr;text-align:left;border:1px solid var(--input-line);background:var(--input);border-radius:6px;padding:6px 9px;font-variant-numeric:tabular-nums}
.amt:disabled{opacity:.6;cursor:not-allowed}
.out{width:100%;direction:ltr;text-align:left;border:1px solid var(--calc-line);background:var(--calc);border-radius:6px;padding:6px 9px;font-variant-numeric:tabular-nums;min-height:34px;cursor:help;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.out.neg{color:var(--bad)}
.out.sch{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 45%,transparent);cursor:pointer}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;font-size:12px;justify-self:start}
.seg button{border:0;background:var(--surface);padding:4px 9px;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--tab-on-bg);color:var(--tab-on-fg);font-weight:600}
.seg button:disabled{cursor:not-allowed}
.pen{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;color:var(--accent);font-weight:600}
.ib{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--acc2);font-weight:700;font-size:12px;display:grid;place-items:center;padding:0;font-family:Georgia,serif;font-style:italic}
.ib:hover{background:var(--acc2);color:#fff;border-color:var(--acc2)}
@media (max-width:640px){
  .row{grid-template-columns:44px minmax(0,1fr) 28px;grid-template-areas:"c l i" "c s s" "c v v"}
  .row>.code{grid-area:c;align-self:start;padding-top:2px}
  .row>.lbl{grid-area:l}
  .row>.ctl{grid-area:s}
  .row>.val{grid-area:v}
  .row>.ib{grid-area:i;align-self:start}
  .row .ctl:empty{display:none}
  .card-b,.card-h{padding-inline:14px}
}
.footer-nav{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.footer-nav .grp{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- help panel ---------- */
.hp-code{display:inline-block;background:var(--acc2);color:#fff;border-radius:6px;padding:0 8px;font-weight:700;font-size:12.5px;margin-inline-end:6px}
.hp-sec{margin-top:12px}
.hp-sec h4{margin:0 0 4px;font-size:12px;color:var(--muted);letter-spacing:.02em;font-weight:600}
.hp-sec p,.hp-sec ul{margin:0;font-size:13px}
.hp-sec ul{padding-inline-start:18px}
.trace{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:12.5px;line-height:2.1}
.tk{display:inline-flex;align-items:baseline;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:0 6px;white-space:nowrap}
.tk em{font-style:normal;color:var(--acc2);font-weight:700;font-size:11.5px}
.tk b{direction:ltr;font-weight:600;font-variant-numeric:tabular-nums}
.op{color:var(--muted);font-weight:700;margin:0 3px}
.res{display:inline-block;margin-top:4px;font-weight:700;color:var(--accent);direction:ltr;font-variant-numeric:tabular-nums}
.guide ol{padding-inline-start:20px;margin:6px 0}
.guide li{margin-bottom:4px}

/* ---------- login / dashboard ---------- */
.otp{display:flex;gap:8px;direction:ltr;justify-content:center}
.otp input{width:48px;height:52px;text-align:center;font-size:22px;border:1px solid var(--input-line);background:var(--input);border-radius:9px}
.dash{display:grid;grid-template-columns:220px minmax(0,1fr);gap:14px}
.side-menu{padding:8px}
.side-menu button{display:flex;width:100%;border:0;background:none;padding:9px 12px;border-radius:8px;text-align:start;color:var(--fg);font-weight:500}
.side-menu button.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.side-menu button:disabled{color:var(--faint);cursor:not-allowed}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:16px;text-align:start;display:flex;flex-direction:column;gap:6px;min-height:118px;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--accent)}
.tile .ico{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-weight:700;color:#fff}
.tile b{font-size:14.5px}
.tile span{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){.dash{grid-template-columns:minmax(0,1fr)}.side-menu{display:flex;overflow-x:auto}.side-menu button{width:auto;white-space:nowrap}}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(10,18,32,.55);display:grid;place-items:center;padding:16px}
.dlg{background:var(--surface);border-radius:16px;width:min(820px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35);border:1px solid var(--line)}
.dlg.sm{width:min(460px,100%)}
.dlg-h{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#074D31;color:#fff;border-radius:16px 16px 0 0}
.dlg-h h3{margin:0;font-size:15px;flex:1}
.dlg-h button{border:0;background:none;color:inherit;font-size:22px;line-height:1}
.dlg-b{padding:14px 16px;overflow:auto}
.dlg-f{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:10px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 16px 16px}
.sch-tbl input{width:100%;border:1px solid var(--input-line);background:var(--input);border-radius:6px;padding:5px 8px;min-width:110px}
.sch-tbl input.amt2{direction:ltr;text-align:left;font-variant-numeric:tabular-nums}
.sch-tbl input[readonly]{background:var(--calc);border-color:var(--calc-line)}
.xbtn{border:0;background:none;color:var(--bad);font-size:18px;line-height:1}

/* ---------- bill ---------- */
.bill{position:relative;overflow:hidden;border:2px dashed var(--line);border-radius:12px;padding:20px;background:var(--surface)}
.bill::after{content:"تدريبي — غير صالحة للسداد";position:absolute;top:44%;left:-10%;right:-10%;text-align:center;transform:rotate(-14deg);font-size:clamp(22px,5vw,42px);font-weight:700;color:var(--red);opacity:.13;pointer-events:none;white-space:nowrap}
.bill-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:12px}
.bill-no{font-size:22px;font-weight:700;letter-spacing:.06em;direction:ltr;color:var(--acc2)}
.bill dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0;font-size:13.5px}
.bill dt{color:var(--muted)} .bill dd{margin:0;font-weight:600}
.big-amt{font-size:28px;font-weight:700;direction:ltr;text-align:right;font-variant-numeric:tabular-nums;color:var(--fg)}
.success{display:flex;gap:14px;align-items:flex-start}
.success .tick{width:52px;height:52px;border-radius:50%;background:var(--ok-solid);display:grid;place-items:center;flex:none}
.success .tick::after{content:"✓";color:#fff;font-size:28px;font-weight:700;line-height:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0D121C;color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;z-index:90;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.foot{background:var(--foot-bg);color:#fff;margin-top:24px}
.foot-in{max-width:1380px;margin:0 auto;padding:22px 16px 26px;font-size:12.5px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;color:#D2D6DB}
.foot b{color:#fff;letter-spacing:.04em}
.quiz-q{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px}
.quiz-q p{margin:0 0 8px;font-weight:600}
.quiz-q label{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.quiz-q label.right{background:var(--ok-soft)} .quiz-q label.wrong{background:var(--bad-soft)}
.quiz-q .why{display:none;font-size:12.5px;color:var(--muted);margin-top:6px}
.quiz-q.answered .why{display:block}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface-2)}
.chk input{margin-top:5px;width:17px;height:17px;flex:none}
.vlist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.vlist li{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:7px 10px;border-radius:7px;background:var(--surface-2)}
.vlist li .pill{margin-top:1px}
tr.sel td{background:var(--accent-soft)}
.paycard{margin-top:0}
.tbl input.amt{min-width:120px}
.modal[hidden],.toast[hidden]{display:none!important}
.jbtn:disabled{opacity:.5;cursor:not-allowed}
.tools{min-width:0;max-width:100%}
.tools select{max-width:100%;min-width:0;flex:1 1 200px;text-overflow:ellipsis}
@media (max-width:640px){.tools{width:100%}.tools .tbtn{flex:1 1 auto}}
.fld label .ib{display:inline-grid;vertical-align:middle;margin-inline-start:6px;width:20px;height:20px;font-size:11px}
@media (max-width:640px){.topbar{position:static}}

/* ---------- site chrome (مطابق لتصميم موقع الهيئة) ---------- */
.gtop{background:var(--surface-2);border-bottom:1px solid var(--line);font-size:13px}
.gtop-in{display:flex;align-items:center;justify-content:space-between;gap:6px 14px;padding:6px 16px;flex-wrap:wrap}
.gtxt{display:flex;align-items:center;gap:8px;color:var(--head);font-weight:500}
.gtxt .sq{width:18px;height:12px;border-radius:2px;background:var(--accent);flex:none}
.gtools{display:flex;align-items:center;gap:14px;color:var(--head);font-weight:500}
.shead{background:var(--surface);border-bottom:1px solid var(--line);box-shadow:0 2px 4px rgba(16,24,40,.06)}
.shead-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;padding:12px 16px}
.wm{display:flex;align-items:center;gap:10px;min-width:0}
.wm-wrap{display:flex;flex-direction:column;gap:6px;min-width:0}
.st-alerts{display:flex;flex-wrap:wrap;gap:6px;padding:6px 12px;background:#FFF8E6;border-bottom:1px solid #F1D9A6}
.st-alerts:empty{display:none}
.st-al{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;line-height:1.5;padding:3px 10px;border-radius:999px;background:#fff;border:1px solid #F1D9A6;color:#5B3B00}
.st-al.hot{background:#FDECEA;border-color:#F5B8B1;color:#8A1C12}
.st-al.ev{background:#EAF4EE;border-color:#B7DBC4;color:#14573A}
.st-al b{font-weight:700}
.st-al a{color:inherit;text-decoration:underline}
.st-al-x{margin-inline-start:auto;border:0;background:none;font-size:12px;color:#7A5A1E;cursor:pointer}
@media (prefers-color-scheme: dark){.st-alerts{background:#2A2414;border-color:#4A3E1E}.st-al{background:#1F1B10;color:#F2D9A0;border-color:#4A3E1E}.st-al.hot{background:#3A1A16;color:#F6B4AC;border-color:#5E2A24}.st-al.ev{background:#12261B;color:#9FD8B5;border-color:#24543A}}

.wm-tr{display:inline-block;align-self:flex-start;background:#B42318;color:#fff;font-size:12px;font-weight:700;line-height:1.5;padding:3px 10px;border-radius:6px;max-width:100%}
.wm .bar{width:6px;height:42px;border-radius:3px;background:var(--accent);flex:none}
.wm b{display:block;font-size:17px;color:var(--head);line-height:1.25}
.wm small{display:block;font-size:11.5px;color:var(--muted);direction:ltr;text-align:right;line-height:1.25}
.snav{display:flex;flex-wrap:wrap;gap:4px 22px;margin:0;padding:0;list-style:none;flex:1;min-width:0}
.snav li{font-size:15px;color:var(--head);font-weight:500;white-space:nowrap}
.snav li::after{content:"⌄";margin-inline-start:6px;color:var(--muted);font-size:12px}
.sact{display:flex;align-items:center;gap:12px;margin-inline-start:auto}
.sbtn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:8px 16px;font-weight:500;font-size:15px;display:inline-flex;gap:8px;align-items:center}
.sbtn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.sbtn.ghost{background:var(--surface-2);color:var(--fg);border-color:var(--surface-2)}
.sbtn.ghost:hover{border-color:var(--line)}
.sbtn:disabled{background:var(--surface-2);border-color:var(--surface-2);color:var(--faint);cursor:not-allowed}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--acc2);display:grid;place-items:center;font-weight:700}
.uname{font-size:14px;color:var(--head);font-weight:500}
@media (max-width:900px){.snav{display:none}.sact{margin-inline-start:0}.shead-in{justify-content:space-between}}
.pg{max-width:1100px;margin:0 auto;padding-inline:16px}
.crumb{display:flex;gap:8px;font-size:13.5px;color:var(--muted);padding-top:14px}
.crumb a{color:var(--fg);text-decoration:none}
.ptitle{font-size:30px;font-weight:700;color:var(--fg);margin:8px 0 18px}
.hero{height:230px;position:relative;overflow:hidden;background:linear-gradient(120deg,#0D121C 0%,#1F2A37 55%,#104631 100%)}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.06) 0 2px,transparent 2px 46px)}
.lcard{position:relative;max-width:1000px;margin:-100px auto 0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:36px clamp(16px,6vw,80px) 40px;width:calc(100% - 32px)}
.tabs2{display:flex;margin:0 auto 24px;max-width:640px;background:var(--surface-2);border-radius:10px;overflow:hidden}
.tabs2 button{flex:1;border:0;background:none;padding:9px 14px;font-size:17px;color:var(--fg);border-radius:10px}
.tabs2 button.on{background:var(--tab-on-bg);color:var(--tab-on-fg)}
.lead{font-size:16px;color:var(--head);margin:0 0 14px}
.svc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.svc{border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-height:190px;background:var(--surface);text-align:start;color:inherit;font-size:16px}
.svc .ic{width:56px;height:56px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.svc h3{margin:0;font-size:18px;font-weight:600;color:var(--head)}
.svc .go{margin-top:auto;width:58px;height:40px;border-radius:4px;background:var(--surface-2);color:var(--fg);font-size:20px;display:grid;place-items:center}
.svc:hover{border-color:var(--accent)}
.svc.off{opacity:.62}
.below{max-width:1000px;margin:22px auto 8px;padding-inline:16px;display:grid;gap:14px}
.lg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);direction:ltr;min-height:560px;background:var(--surface)}
.lg>*{direction:rtl}
.lg-form{display:flex;flex-direction:column;justify-content:center;padding:40px clamp(18px,5vw,64px);gap:14px;width:100%;max-width:640px;margin-inline:auto}
.lg-form h1{font-size:30px;font-weight:700;margin:0;color:var(--head)}
.lg-form .sub{color:var(--head);font-size:16px;margin:0;padding-bottom:14px;border-bottom:1px solid #D2D6DB}
.lg label{font-size:14px;color:var(--fg);display:block;margin-bottom:4px;line-height:20px}
.lg label i{color:#B42318;font-style:normal;margin-inline-start:2px}
.lg input.in{width:100%;height:40px;border:.8px solid #9DA4AE;border-radius:4px;padding:0 8px;background:var(--surface);font-size:16px;color:var(--thfg)}
.lnk{color:var(--accent);font-size:14px;text-decoration:none;background:none;border:0;padding:0;text-align:start;font-weight:400;line-height:20px}
.lnk:hover{text-decoration:underline}
.lg .sbtn{align-self:flex-start;height:40px;padding:8px 16px;font-size:16px;font-weight:500}
.or{display:flex;align-items:center;gap:10px;color:var(--fg);font-size:16px}
.or::before,.or::after{content:"";flex:1;height:1px;background:#E5E7EB}
.lg-art{position:relative;overflow:hidden;background:linear-gradient(160deg,#0D121C,#14573A 70%,#1B8354);display:grid;place-items:center;color:#fff;min-height:220px}
.lg-art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 40px)}
.lg-art .wm,.lg-art .wm-wrap{position:relative}
.lg-art .wm b{color:#fff;font-size:22px}
.lg-art .wm small{color:#D2D6DB}
.lg-art .wm .bar{background:#fff}
.lg-foot{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);padding-top:6px}
@media (max-width:820px){.lg{grid-template-columns:1fr}.lg-art{order:-1}}

/* ---------- search page (محاكاة محرك البحث) ---------- */
:root{--sr-bg:#ffffff;--sr-fg:#202124;--sr-mut:#4d5156;--sr-link:#1a0dab;--sr-line:#dadce0;--sr-chip:#f1f3f4}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sr-bg:#202124;--sr-fg:#e8eaed;--sr-mut:#bdc1c6;--sr-link:#8ab4f8;--sr-line:#3c4043;--sr-chip:#303134}}
:root[data-theme="dark"]{--sr-bg:#202124;--sr-fg:#e8eaed;--sr-mut:#bdc1c6;--sr-link:#8ab4f8;--sr-line:#3c4043;--sr-chip:#303134}
.srch{background:var(--sr-bg);color:var(--sr-fg);min-height:520px}
.srch-home{display:flex;flex-direction:column;align-items:center;gap:18px;padding:70px 16px 40px}
.srch-name{font-size:34px;font-weight:700;letter-spacing:.02em}
.srch-name small{display:block;font-size:12px;font-weight:500;color:var(--sr-mut);text-align:center;letter-spacing:0}
.srch-name.sm{font-size:20px;white-space:nowrap}
.srch-box{display:flex;align-items:center;gap:10px;border:1px solid var(--sr-line);border-radius:999px;padding:6px 8px 6px 16px;width:min(620px,100%);background:var(--sr-bg);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.srch-box input{flex:1;min-width:0;border:0;background:transparent;color:var(--sr-fg);font-size:16px;padding:8px 4px;outline:0}
.srch-box .sbtn{border-radius:999px;padding:6px 18px;font-size:14px}
.srch-box.sm{width:min(620px,100%)}
.srch-hints .linkbtn{color:var(--sr-link)}
.srch-top{display:flex;align-items:center;gap:18px;padding:14px 16px;border-bottom:1px solid var(--sr-line);flex-wrap:wrap}
.srch-tabs{display:flex;gap:20px;padding:0 20px;border-bottom:1px solid var(--sr-line);font-size:14px;color:var(--sr-mut)}
.srch-tabs span{padding:10px 2px}
.srch-tabs .on{color:var(--sr-link);border-bottom:3px solid var(--sr-link)}
.srch-body{max-width:720px;padding:14px 20px 30px}
.sr{margin:0 0 22px}
.sr-site{display:flex;align-items:center;gap:10px;margin-bottom:4px;font-size:14px}
.sr-site b{display:block;font-weight:500;color:var(--sr-fg)}
.sr-url{display:block;color:var(--sr-mut);font-size:12.5px;direction:ltr;text-align:right}
.sr-fav{width:28px;height:28px;border-radius:50%;background:var(--sr-chip);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;color:var(--accent)}
.sr-fav.fk{color:#d93025}
.sr-ad{margin-inline-start:auto;font-size:12px;border:1px solid var(--sr-mut);border-radius:4px;padding:0 6px;color:var(--sr-mut)}
.sr-t{border:0;background:none;padding:0;text-align:start;font-size:20px;color:var(--sr-link);font-weight:400;line-height:1.35}
.sr-t:hover{text-decoration:underline}
.sr p{margin:4px 0 0;color:var(--sr-mut);font-size:14px;line-height:1.55}
/* ---------- home page ---------- */
.hbanner{background:linear-gradient(120deg,#074D31 0%,#1B8354 70%,#25935F 100%);color:#fff;position:relative;overflow:hidden}
.hbanner::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.07) 0 2px,transparent 2px 46px)}
.hb-in{position:relative;max-width:1100px;margin:0 auto;padding:46px 16px 50px;display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.hb-in h2{margin:0;font-size:clamp(24px,4vw,36px)}
.hb-in p{margin:0;color:#E5E7EB;max-width:50ch}
.hb-in .btn{background:#F3F4F6;color:#161616;border-color:#F3F4F6}
.hv-l{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hv-l li{border-top:1px solid var(--line-2);padding-top:8px}
.hv-l .lnk{font-size:15px}
.card.hv{margin-top:0!important}

/* ---------- معالج الإقرار (مطابق لإقرارات البوابة) ---------- */
.card.wz{display:grid;grid-template-columns:240px minmax(0,1fr);border-radius:0;border:0;box-shadow:none;background:var(--surface);margin:-16px}
.wz>*{grid-column:2;min-width:0}
.wz>.wz-top,.wz>.ret-head{grid-column:1/-1}
.wz>.vstep{grid-column:1;grid-row:3 / span 30;align-self:start;position:sticky;top:88px}
.wz-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
.wz-top h2{margin:0;font-size:20px;color:var(--head);text-align:center}
.wz-top .wm b{font-size:14px}
.wz-top .wm small{font-size:10.5px}
.wz-top .wm .bar{height:34px}
.wz-x{justify-self:end;border:0;background:none;color:var(--head);font-size:15px;display:inline-flex;gap:8px;align-items:center;padding:6px 8px}
.wz-x:hover{color:var(--accent)}
.vstep{display:flex;flex-direction:column;padding:26px 20px 20px}
.vs{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0 0 30px;position:relative;text-align:start;color:var(--faint);font-size:14.5px;font-weight:500;min-height:36px}
.vs::after{content:"";position:absolute;inset-inline-start:17px;top:36px;bottom:0;width:2px;background:var(--line)}
.vs:last-child{padding-bottom:0}
.vs:last-child::after{display:none}
.vs .c{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-weight:600;font-size:14px;color:var(--faint);flex:none;position:relative;z-index:1}
.vs.done{color:var(--fg)}
.vs.done .c{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vs.done::after{background:var(--accent)}
.vs.cur{color:var(--head);font-weight:700}
.vs.cur .c{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.vs.na{opacity:.45}
.vs.na .c{border-style:dashed}
.vs:hover .c{border-color:var(--accent)}
.wz .step-title h2{font-size:26px;color:var(--head)}
.wz .rows{padding-inline:20px}
.wz .footer-nav{margin:10px 20px 20px;border:0;background:transparent;padding:12px 0 0;border-top:1px solid var(--line)}
.wz .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.rq{color:var(--bad)}
.vq p{margin:0 0 6px;font-weight:600;color:var(--head)}
.vq label{display:flex;align-items:center;gap:10px;padding:2px 0;cursor:pointer}
.vq input[type=radio]{accent-color:var(--accent);width:18px;height:18px}
.vt{border:1px solid var(--line)}
.vt th{background:var(--surface-2);color:var(--muted);font-weight:500}
.vt td:nth-child(1),.vt td:nth-child(2){background:var(--surface-2)}
.vt td:nth-child(1){text-align:center;width:44px}
.vt td:nth-child(2){min-width:210px}
.vt .amt{min-width:96px!important}
.vt td{padding:8px 8px}
.vt input.amt{height:40px;border-radius:4px;border-color:var(--input-line);background:var(--surface);min-width:110px}
.vt .out{height:40px;border-radius:4px}
.fld textarea{font-family:inherit}
@media (max-width:860px){
  .card.wz{display:block}
  .wz>.vstep{position:static;flex-direction:row;overflow-x:auto;padding:12px 16px;gap:4px;border-bottom:1px solid var(--line)}
  .vs{padding:0 6px 0 14px;flex:none}
  .vs::after{display:none}
  .vs:not(.cur) .vl{display:none}
  .wz-top{grid-template-columns:1fr auto}
  .wz-top .wm{display:none}
  .wz-top h2{text-align:start;font-size:16px}
}

.wz-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:18px 20px 24px}
.wz-foot .sp{margin-inline-start:auto}
.wz-foot .btn{height:40px;padding:0 20px;border-radius:4px;font-size:14.5px}
.btn.gray{background:var(--surface-2);border-color:var(--surface-2);color:var(--fg)}
.btn.gray:hover{border-color:var(--line)}
.btn.gray:disabled{opacity:.5}
.att{padding-bottom:6px}
.infobox{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-inline-start:6px solid var(--accent);border-radius:4px;padding:12px 16px;background:var(--surface);font-size:13.5px}
.infobox .ii{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-style:italic;font-weight:700;font-family:Georgia,serif;flex:none}
.infobox ol{margin:0;padding-inline-start:18px;line-height:1.9;color:var(--head)}

.rad{display:inline-flex;gap:16px;align-items:center;justify-self:start}

.rad .r input::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .12s}
.rad .r input:checked{border-color:var(--accent)}

.pen{width:36px;height:36px;padding:0;display:grid;place-items:center;border:1px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:4px}

.pen:disabled{border-color:var(--line);color:var(--faint);background:var(--surface-2);cursor:not-allowed}
.ib{width:22px;height:22px;border-radius:4px;border:0;background:var(--accent);color:#fff;font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:13px}

.acc .chev{width:10px;height:10px;border-right:2px solid var(--head);border-bottom:2px solid var(--head);transform:rotate(135deg);transition:transform .15s;flex:none}

@media (max-width:640px){.acc{margin-inline:12px}.wz-bar{padding:10px 12px}.wz-bar .refno{order:9;flex-basis:100%;border:0;padding:0}.wz-bar .btn{padding:0 14px}}

function blankVat(){ return {name:"", vatNo:"", freq:"M", year:new Date().getFullYear(), p:1, rows:{}, corr:0, cf:0, annual40:"no", claim:"carry"}; }
function blankWht(){ return {name:"", tin:"", year:new Date().getFullYear(), m:1, ap:{}, amt:{}, rr:{}, reg:{}, agree:false, fdate:""}; }
/* تحويل الصيغة القديمة (دفعات لكل مستفيد) المحفوظة في المتصفح إلى جدول الـ13 صف */
function normWht(w){
  if (!w) return blankWht();
  if (Array.isArray(w.rows)) {
    const map = {frt:"air"}; w.ap = w.ap || {}; w.amt = w.amt || {};
    w.rows.forEach(r => { if (!r || !r.type) return; const k = map[r.type] || r.type; w.ap[k] = 1; w.amt[k] = (w.amt[k] || 0) + (+r.amt || 0); });
    delete w.rows; delete w.nil;
  }
  w.ap = w.ap || {}; w.amt = w.amt || {}; w.rr = w.rr || {}; w.reg = w.reg || {};
  return w;
}

/* ----- الفترات ----- */
function vatPeriod(){
  const v = S.vat, y = +v.year || 2026, p = +v.p || 1;
  if (v.freq === "Q") { const q = Math.min(4, Math.max(1, p)); return {key: y + "-Q" + q, label: QTRS[q-1] + " " + y, start: Date.UTC(y, (q-1)*3, 1), end: Date.UTC(y, q*3, 0), due: Date.UTC(y, q*3 + 1, 0)}; }
  const m = Math.min(12, Math.max(1, p)); return {key: y + "-M" + m, label: MONTHS[m-1] + " " + y + " (شهري)", start: Date.UTC(y, m-1, 1), end: Date.UTC(y, m, 0), due: Date.UTC(y, m + 1, 0)};
}
function whtPeriod(){
  const w = S.wht, y = +w.year || 2026, m = Math.min(12, Math.max(1, +w.m || 1));
  return {key: y + "-" + m, label: MONTHS[m-1] + " " + y, start: Date.UTC(y, m-1, 1), end: Date.UTC(y, m, 0), due: Date.UTC(y, m, 10)};
}

/* ----- القيمة المضافة ----- */
function computeVat(){
  const v = S.vat, R = {rows: {}};
  const g = k => { const a = v.rows[k] || [0, 0]; return [num(a[0]), num(a[1])]; };
  let sa = 0, sj = 0, sv = 0, pa = 0, pj = 0, pv = 0, rcv = 0;
  VAT_S.forEach(d => { const [a, j] = g(d.k); const vat = d.vat ? r2((a + j) * (d.rate || VAT_RATE)) : 0; R.rows[d.k] = {a, j, vat}; sa += a; sj += j; sv += vat; });
  VAT_P.forEach(d => { const [a, j] = g(d.k); const vat = d.vat ? r2((a + j) * VAT_RATE) : 0; R.rows[d.k] = {a, j, vat}; pa += a; pj += j; pv += vat; if (d.rc) rcv += vat; });
  R.t6 = {a: sa, j: sj, vat: r2(sv)}; R.t12 = {a: pa, j: pj, vat: r2(pv)}; R.rcv = r2(rcv);
  R.b13 = r2(sv - pv + rcv);
  R.b14 = r2(num(v.corr)); R.b15 = r2(Math.max(0, num(v.cf)));
  R.net = r2(R.b13 + R.b14 - R.b15);
  R.sales = sa + sj; R.purch = pa + pj;
  R.per = vatPeriod();
  return R;
}
function validateVat(R){
  const out = [], v = S.vat, push = (lvl, msg, step) => out.push({lvl, msg, step});
  if (!String(v.name || "").trim()) push("bad", "اسم المكلف فاضي.", 0);
  if (!/^3\d{13}3$/.test(String(v.vatNo || ""))) push("bad", "الرقم الضريبي لازم يكون 15 رقم، يبدأ وينتهي بـ 3.", 0);
  if (Math.abs(R.b14) > 15000) push("bad", "التصحيحات في البند 14 لازم تكون في حدود ±15,000 ريال. الأكبر من كده يتقدم بطلب تصحيح إقرار منفصل.", 3);
  if (num(v.cf) < 0) push("bad", "الرصيد المرحل (15) ما يكونش سالب.", 3);
  if (R.sales === 0 && R.purch === 0 && R.b14 === 0) push("warn", "الإقرار صفري (ما فيهوش مبيعات ولا مشتريات). الإقرار الصفري لازم يتقدم برضه في موعده.", 1);
  const vs = R.rows.s1.a + R.rows.s1.j;
  if (R.rows.s1.a < 0) push("warn", "مبيعات البند 1 بالسالب. ممكن مردودات؟ الأفضل تسجيلها في عمود التعديلات.", 1);
  if (vs > 0 && R.t12.vat > R.t6.vat * 3 && R.t6.vat > 0) push("warn", "ضريبة المدخلات أكبر من 3 أضعاف المخرجات. الهيئة ممكن تطلب مستندات المدخلات.", 2);
  if (R.net < 0) push("info", "الصافي بالسالب: يعني رصيد دائن. تقدر تطلب استرداده أو ترحله للفترة القادمة.", 4);
  if (R.rows.s4.a > 0) push("info", "الصادرات بتحتاج مستندات (بيان جمركي، فاتورة، إثبات شحن) تفضل محفوظة لو الهيئة طلبتها.", 1);
  if (R.rows.p9.a > 0) push("info", "الاحتساب العكسي (9): الضريبة بتتحسب كمخرجات ومدخلات في نفس الوقت، وأثرها على الصافي صفر.", 2);
  if (v.annual40 === "yes" && v.freq === "Q") push("warn", "التوريدات السنوية أكتر من 40 مليون ريال، فالتقديم الشهري هو المطلوب مش الربع سنوي.", 0);
  if (v.annual40 === "no" && v.freq === "M") push("info", "فترة شهرية مع توريدات أقل من 40 مليون: ده جائز لو اخترته أو الهيئة ألزمتك بيه.", 0);
  if (!out.some(x => x.lvl === "bad")) push("ok", "مفيش أخطاء تمنع التقديم.", 4);
  return out;
}

/* ----- الاستقطاع ----- */
function whtRowRate(k){ const w = S.wht, o = (w.rr || {})[k]; if (o !== undefined && o !== null && o !== "" && num(o) >= 0) return Math.min(0.99, num(o) / 100); const d = WHT_ROWS.find(x => x.k === k); return d ? d.r : 0; }
function computeWht(){
  const w = S.wht, per = whtPeriod(), R = {rows: {}, per};
  let base = 0, tax = 0, n = 0;
  WHT_ROWS.forEach(d => {
    const ap = !!(w.ap || {})[d.k], amt = ap ? Math.max(0, num((w.amt || {})[d.k])) : 0, rate = whtRowRate(d.k), t = r2(amt * rate);
    R.rows[d.k] = {ap, amt, rate, tax: t}; if (ap) { n++; base += amt; tax += t; }
  });
  R.count = n; R.base = r2(base); R.tax = r2(tax);                       /* 14: الإجمالي الشهري */
  const fd = pd(w.fdate), fileAt = fd != null ? fd : todayUTC();
  R.fileAt = fileAt; R.late = Math.max(0, Math.round((fileAt - per.due) / 864e5)); R.units = Math.ceil(R.late / 30);
  R.pen = r2(R.tax * WHT_PEN * R.units);                                  /* 15: غرامة التأخير */
  R.total = r2(R.tax + R.pen);                                            /* 16: إجمالي الضريبة والغرامة */
  return R;
}
function validateWht(R){
  const out = [], w = S.wht, push = (lvl, msg, step) => out.push({lvl, msg, step});
  if (!w.agree) push("bad", "لازم تؤشر «أنا أوافق» في خطوة التعليمات.", 0);
  if (!String(w.name || "").trim()) push("bad", "اسم المكلف (الدافع) فاضي.", 1);
  if (!/^3\d{9}$/.test(String(w.tin || "")) && !/^3\d{13}3$/.test(String(w.tin || ""))) push("bad", "الرقم المميز للدافع لازم يكون 10 أرقام (أو 15 رقم ضريبي) ويبدأ بـ 3.", 1);
  if (R.count === 0) push("warn", "كل الصفوف «لا يطبق»: الإقرار صفري. الاستقطاع بيتقدم أصلاً عن شهر فيه دفعات لغير مقيمين، فراجع لو محتاج تقدمه.", 2);
  WHT_ROWS.forEach(d => {
    const r = R.rows[d.k]; if (!r.ap) return;
    if (!(r.amt > 0)) push("bad", "البند " + d.n + " (" + d.l + "): اخترت «يطبق» لكن إجمالي الدفع صفر. ادخل المبلغ أو غيّر الاختيار إلى «لا يطبق».", 2);
    if (num((w.rr || {})[d.k]) > 0 && Math.abs(r.rate - d.r) > 1e-9) push("info", "البند " + d.n + " (" + d.l + "): بتطبق نسبة " + pct(r.rate, 2) + " بدل النسبة النظامية " + pct(d.r, 2) + ". التخفيض بالاتفاقية يحتاج شهادة إقامة ضريبية ومستفيد حقيقي.", 2);
  });
  if (!S.decl) push("bad", "لازم تؤشر مربع الإقرار في خطوة «إقرار».", 3);
  if (R.pen > 0) push("warn", "الإقرار متأخر " + R.late + " يوم عن آخر موعد (" + fmtD(R.per.due) + "). غرامة التأخير " + fmt(R.pen) + " ريال (1% عن كل 30 يوم).", 2);
  if (R.tax > 0) push("info", "الضريبة تُسدد مع الإقرار قبل يوم 10 من الشهر التالي.", 2);
  if (!out.some(x => x.lvl === "bad")) push("ok", "مفيش أخطاء تمنع التقديم.", 5);
  return out;
}

function blankExc(){ return {name:"", tin:"", year:2026, bp:1, lines:[], credit:0, corr:0, nil:false, claim:"carry", note:""}; }
function excPeriod(e){
  e = e || S.exc; const y = +e.year || 2026, b = Math.min(6, Math.max(1, +e.bp || 1));
  return {key: y + "-B" + b, label: BPS[b - 1] + " " + y + " (فترة شهرين)", start: Date.UTC(y, (b - 1) * 2, 1), end: Date.UTC(y, b * 2, 0), due: Date.UTC(y, b * 2 + 1, 0), code: "E" + String(y).slice(2) + b};
}
const excGood = k => EXC_GOODS.find(x => x.k === k);
const excTier = k => EXC_TIERS.find(x => x.k === k);
function excLineCalc(r){
  const g = excGood(r.g); if (!g) return {q: 0, base: 0, tax: 0, rate: 0};
  const q = Math.max(0, num(r.q) - num(r.x));
  if (g.kind === "liter") { const t = excTier(r.t); return {q, base: q, tax: t ? r2(q * t.per) : 0, rate: t ? t.per : 0}; }
  const base = r2(q * num(r.p));
  return {q, base, tax: r2(base * g.rate), rate: g.rate};
}
function computeExc(e){
  e = e || S.exc; const R = {rows: [], per: excPeriod(e)};
  let tax = 0, base = 0;
  (e.nil ? [] : e.lines).forEach(r => { const c = excLineCalc(r); R.rows.push(c); tax += c.tax; base += c.base; });
  R.gross = r2(tax); R.base = r2(base);
  R.credit = r2(Math.max(0, num(e.credit))); R.corr = r2(num(e.corr));
  R.net = r2(R.gross - R.credit + R.corr);
  R.count = R.rows.length;
  return R;
}
function validateExc(R){
  const out = [], e = S.exc, push = (lvl, msg, step) => out.push({lvl, msg, step});
  if (!String(e.name || "").trim()) push("bad", "اسم المكلف فاضي.", 0);

  e.lines.forEach((r, i) => {
    if (e.nil) return; const n = "السطر " + (i + 1), g = excGood(r.g);
    if (!g) { push("bad", n + ": اختار نوع السلعة.", 1); return; }
    if (!(num(r.q) > 0)) push("bad", n + ": الكمية لازم تكون أكبر من صفر.", 1);
    if (num(r.x) > num(r.q)) push("bad", n + ": الكمية المصدّرة أو المعلّقة أكبر من الكمية الكلية.", 1);
    if (g.kind === "rsp" && !(num(r.p) > 0)) push("bad", n + ": سعر البيع للمستهلك (السعر المعلن) ناقص.", 1);
    if (g.kind === "liter" && !r.t) push("bad", n + ": اختار شريحة السكر لكل 100 مل.", 1);
    if (g.kind === "liter" && (r.t === "t1" || r.t === "t2") && num(r.q) > 0) push("info", n + ": الشريحة دي ضريبتها صفر، لكن لازم تتسجل في الإقرار.", 1);
  });
  if (R.credit > R.gross + 0.004 && R.gross >= 0) push("warn", "مبلغ المرتجعات والإتلاف أكبر من ضريبة الفترة. الفرق هيطلع رصيد دائن وممكن الهيئة تراجعه.", 2);
  if (e.nil) push("info", "إقرار بدون سلع: لازم يتقدم برضه في موعده.", 0);
  if (R.net > 0.004) push("info", "الضريبة بتتسدد قبل " + fmtD(R.per.due) + ". التأخير في السداد غرامته 5% من الضريبة عن كل شهر أو جزء منه، والتأخير في التقديم من 5% إلى 25%.", 3);
  if (R.net < -0.004) push("info", "الصافي بالسالب: رصيد دائن. تقدر تطلب استرداده أو ترحله.", 3);
  if (!out.some(x => x.lvl === "bad")) push("ok", "مفيش أخطاء تمنع التقديم.", 3);
  return out;
}

}

function computeRett(){
  const q = S.req.rett, v = Math.max(0, num(q.value)), R = {value: v};
  const exemptAll = q.exempt !== "none";
  const firstOk = !!q.first && q.prop === "res";
  R.exemptPart = exemptAll ? v : (firstOk ? Math.min(v, RETT_FIRST_CAP) : 0);
  R.taxable = r2(Math.max(0, v - R.exemptPart));
  R.tax = r2(R.taxable * RETT_RATE);
  R.state = r2(firstOk && !exemptAll ? Math.min(v, RETT_FIRST_CAP) * RETT_RATE : 0);
  R.gross = r2(v * RETT_RATE);
  const d = pd(isoFromDmy(q.date)); R.date = d;
  R.due = d == null ? null : (q.kind === "sale" ? d : addDays(d, 30));
  return R;
}

function validate(R){

  if (!/^3\d{9}$/.test(String(S.info.tin || ""))) push("bad", "الرقم المميز لازم يكون 10 أرقام ويبدأ بـ 3.", "info");
  if (!String(S.info.name || "").trim()) push("bad", "اسم المكلف فاضي.", "info");
  if (Math.abs(R.TA[1]) < 0.005) push("bad", "المركز المالي فاضي، وإجمالي الأصول بيدخل في الحد الأدنى للوعاء (4028).", "bs");
  else {

    if (Math.abs(R.bsDiff[0]) > 1) push("bad", "المركز المالي أول المدة مش متوازن. الفرق " + fmt(R.bsDiff[0]) + ".", "bs");
  }
  if (!S.att.some(a => a.type === "FS")) push("bad", "لازم ترفق القوائم المالية المعتمدة (زرار «مرفقات»).", "attach");
  if (S.fsNP != null && S.fsNP !== "") {
    const d = R["2033"] - num(S.fsNP);
    if (Math.abs(d) > 1) push("warn", "صافي الربح في الإقرار (" + fmt(R["2033"]) + ") مختلف عن القوائم المعتمدة (" + fmt(num(S.fsNP)) + ") بفرق " + fmt(d) + ". الاختلاف ده بيطلع إشعار عدم مطابقة من الهيئة.", "inc");

  } else push("warn", "ما اتسجلش صافي الربح حسب القوائم المعتمدة، فالمطابقة ما اتعملتش (معلومات أساسية).", "info");

function submitNow(){

function ib(k){ return `<button type="button" class="ib" data-act="help" data-k="${k}" aria-label="شرح البند">i</button>`; }
function parseDate(s){
  s = String(s || "").trim().replace(/[٠-٩]/g, d => AR_DIG.indexOf(d));
  let m = /^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/.exec(s);
  if (m) return m[3] + "-" + m[2].padStart(2, "0") + "-" + m[1].padStart(2, "0");
  m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s); return m ? s : "";
}
const isoToDmy = iso => { const d = pd(iso); return d == null ? "" : fmtD(d); };

/* ===================== نموذج 10 ===================== */
function seg(k, on, dis){
  const r = (v, lab, ck) => `<label class="r${ck ? " on" : ""}"><input type="radio" name="ap_${k}" data-apk="${k}" data-v="${v}" ${ck ? "checked" : ""} ${dis ? "disabled" : ""}><span>${lab}</span></label>`;
  return `<div class="rad" role="radiogroup" aria-label="ينطبق / لا ينطبق">${r(1, "ينطبق", on)}${r(0, "لا ينطبق", !on)}</div>`;
}
const PEN_SVG = `<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
function rowF(d, R, C){
  if (d.t === "h") return `<div class="row h"><b>${d.l}</b></div>`;
  if (hiddenFor(d, C)) return "";
  const k = d.k, code = d.code || d.c, hk = (!C.isNew && H[k + "o"]) ? k + "o" : k, hint = (H[hk] || H[k] || {}).d || "";
  const pen = (act, dis) => `<button type="button" class="pen" data-act="${act}" data-k="${k}" ${dis ? "disabled" : ""} aria-label="${act === "sched" ? "تفاصيل البند" : "تعديل البند"}" title="${dis ? "فعّل «ينطبق» أولاً" : "فتح نافذة التفاصيل"}">${PEN_SVG}</button>`;
  let ctl = "", val = "";
  switch (d.t) {
    case "in": val = `<input class="amt" inputmode="decimal" data-k="${k}" value="${esc(fmtIn(S.v[k]))}" aria-label="${esc(d.l)}">`; break;
    case "calc": val = `<div class="out" data-out="${k}" tabindex="0"></div>`; break;
    case "list": ctl = seg(k, !!S.app[k]) + pen("sched", !S.app[k]); val = `<div class="out sch" data-out="${k}"></div>`; break;
    case "radioin": ctl = seg(k, !!S.app[k]); val = `<input class="amt" inputmode="decimal" data-k="${k}" value="${esc(fmtIn(S.v[k]))}" ${S.app[k] ? "" : "disabled"} aria-label="${esc(d.l)}">`; break;
    case "fixed": ctl = pen("fixed"); val = `<div class="out sch" data-out="${k}"></div>`; break;
    case "adj": ctl = seg(k, !!S.app[k]) + pen("adj", !S.app[k]); val = `<div class="out sch" data-out="${k}"></div>`; break;
    case "debt": ctl = seg(k, !!S.app[k]) + pen("debt", !S.app[k]); val = `<div class="out sch" data-out="4007"></div>`; break;
  }
  return `<div class="row ${d.tot ? "tot" : ""} ${d.grand ? "grand" : ""}" data-row="${k}"><span class="code">${code}</span><div class="lbl"><b>${d.l}</b><div class="hint">${esc(hint)}</div></div><div class="ctl" style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${ctl}</div><div class="val">${val}</div>${ib(k)}</div>`;
}
function rowsOf(list, R, C){ return `<div class="rows">${list.map(d => rowF(d, R, C)).join("")}</div>`; }
/* أكورديون: كل عنوان (h) يصبح قسماً قابلاً للطي، كما في شاشات الوعاء والتعديلات بالبوابة */
function rowsAcc(list, R, C, sid){
  const groups = []; let cur = {h: null, rows: []}; groups.push(cur);
  list.forEach(d => { if (d.t === "h") { cur = {h: d.l, rows: []}; groups.push(cur); } else cur.rows.push(d); });
  const ac = (S.ui.acc = S.ui.acc || {});
  return groups.filter(g => g.rows.some(d => !hiddenFor(d, C))).map(g => {
    const body = `<div class="rows">${g.rows.map(d => rowF(d, R, C)).join("")}</div>`;
    if (g.h == null) return body;
    const key = sid + ":" + g.h;
    return `<details class="acc" data-ak="${esc(key)}" ${ac[key] === 0 ? "" : "open"}><summary><span class="chev" aria-hidden="true"></span><b>${g.h}</b></summary>${body}</details>`;
  }).join("");
}

/* ===================== شريط تنبيهات المواعيد =====================
   المواعيد محسوبة من القاعدة العامة (اللائحة): الزكاة والدخل 120 يوم بعد نهاية السنة، القيمة المضافة آخر يوم في الشهر التالي للفترة،
   الاستقطاع يوم 10 من الشهر التالي. لو الموعد جه إجازة رسمية بيتمد لأول يوم عمل — المرجع تقويم الهيئة.
   ST_EVENTS: قرارات/مواعيد بتدخل حيز التنفيذ — بتتحدث يدوي من هنا. */
const ST_EVENTS = [
  /* {d: "yyyy-mm-dd", t: "نص القرار اللي بيدخل حيز التنفيذ", warn: 60} — مواعيد الموجات بتتضاف لوحدها من WAVE_PROGRAMS */
];
const ST_CAL = "https://zatca.gov.sa/ar/MediaCenter/Publications/Documents/Zakat%20Declaration%20and%20Tax%20Returns%20Calendar.pdf";
function stDeadlines(){
  const t0 = todayUTC(), y = new Date(t0).getUTCFullYear(), m = new Date(t0).getUTCMonth(), D = (yy, mm, dd) => Date.UTC(yy, mm, dd), endOf = (yy, mm) => D(yy, mm + 1, 0);
  const out = [];
  /* الزكاة وضريبة الدخل لسنة مالية تنتهي 31/12: 120 يوم = 30 أبريل */
  [y - 1, y].forEach(fy => { const due = D(fy, 11, 31) + 120 * 864e5; out.push({due, warn: 45, t: `إقرار الزكاة وضريبة الدخل لسنة ${fy} (للسنة المنتهية 31/12)`, act: "f10"}); });
  /* القيمة المضافة ربع سنوي: آخر يوم في الشهر التالي لنهاية الربع */
  for (let q = -1; q <= 4; q++) { const qe = endOf(y, q * 3 - 1), d = new Date(qe), due = endOf(d.getUTCFullYear(), d.getUTCMonth() + 1), qn = ((q % 4) + 4) % 4 || 4; out.push({due, warn: 30, t: `إقرار القيمة المضافة الربع سنوي (الربع ${qn} — ${new Date(qe).getUTCFullYear()})`, act: "vat"}); }
  /* القيمة المضافة الشهري + الاستقطاع: الشهر الحالي والسابق */
  [m - 1, m].forEach(mm => { const pe = new Date(endOf(y, mm)), py = pe.getUTCFullYear(), pm = pe.getUTCMonth();
    out.push({due: endOf(py, pm + 1), warn: 10, t: `إقرار القيمة المضافة الشهري (${MONTHS[pm]} ${py})`, act: "vat"});
    out.push({due: D(py, pm + 1, 10), warn: 10, t: `نموذج الاستقطاع الشهري (${MONTHS[pm]} ${py})`, act: "wht"}); });
  ST_EVENTS.concat(typeof waveEvents === "function" ? waveEvents() : []).forEach(e => out.push({due: pd(e.d), warn: e.warn || 60, t: e.t, ev: 1, act: e.act}));
  return out.filter(x => x.due != null && x.due >= t0 && (x.due - t0) / 864e5 <= x.warn).map(x => Object.assign(x, {days: Math.round((x.due - t0) / 864e5)})).sort((a, b) => a.due - b.due);
}
function renderAlerts(){
  const el = document.getElementById("stAlerts"); if (!el) return;
  let hid = {}; try { hid = JSON.parse(sessionStorage.getItem("stAlertsHide") || "{}"); } catch (e) {}
  const list = stDeadlines().filter(x => !hid[x.t + x.due]).slice(0, 4);
  if (!list.length) { el.innerHTML = ""; return; }
  el.innerHTML = list.map(x => `<span class="st-al ${x.ev ? "ev" : x.days <= 7 ? "hot" : ""}">${x.ev ? "📌" : "⏰"} <span>${x.days === 0 ? "<b>النهارده</b>" : x.days === 1 ? "<b>بكرة</b>" : `باقي <b>${x.days}</b> يوم`} — ${x.t} · آخر موعد <b class="num">${fmtD(x.due)}</b></span>${x.act ? ` <a href="#" data-act="alGo" data-v="${x.act}">${x.act === "waveOpen" ? "شوف الموجات" : "تدرّب عليه"}</a>` : ""}</span>`).join("")
    + `<span class="st-al" style="background:none;border:0">الأحوط تقدّم وتسدد قبل الموعد المكتوب، وما تعتمدش على أي تمديد إلا بإعلان رسمي · المرجع <a href="${ST_CAL}" target="_blank" rel="noopener">تقويم الهيئة</a></span><button type="button" class="st-al-x" data-act="alHide" aria-label="إخفاء التنبيهات">إخفاء ✕</button>`;
}

    else if (["capNs", "prfNs"].includes(f)) { if (String(t.value).trim() === "") delete S.info[f]; else S.info[f] = Math.min(100, Math.max(0, num(t.value))); rerenderKeep(); }
    else if (f === "legal") { S.info.legal = t.value; rerenderKeep(); }
    else if (f === "fsNP") { S.fsNP = t.value.trim() === "" ? null : num(t.value); live(); }
    save();
  } else if (d.vf) {
    const f = d.vf;
    if (f === "corr") { if (String(t.value).trim() !== "") S.vat.corr = num(t.value); live(); }
    else if (f === "cf") { S.vat[f] = num(t.value); live(); }
    else {
      S.vat[f] = (f === "year" || f === "p") ? Math.round(num(t.value)) : t.value;
      if (f === "freq" && t.value === "Q") S.vat.p = Math.min(4, Math.ceil((+S.vat.p || 1) / 3));
      if (f === "freq" && t.value === "M" && S.vat.p < 1) S.vat.p = 1;
      rerenderKeep();
    }
    save();
  } else if (d.wm) {
    const f = d.wm; S.wht[f] = (f === "year" || f === "m") ? Math.round(num(t.value)) : t.value; rerenderKeep(); save();
  } else if (d.wamt !== undefined || d.wrr !== undefined) {
    renderPanel(); save();
  } else if (d.pen) { S.ui.pen = S.ui.pen || {}; S.ui.pen[d.pen] = num(t.value); rerenderKeep(); save(); }
});
document.addEventListener("focusout", e => {
  const t = e.target, d = t && t.dataset || {};
  if (!(d.vat || d.vf === "corr") || !t.matches || !t.matches("input")) return;
  S.ui.vE = S.ui.vE || {};
  const key = vKeyOf(t);
  if (String(t.value).trim() === "" || t.value === "-") { S.ui.vE[key] = "x"; vatMark(t, true); }
  else { delete S.ui.vE[key]; vatMark(t, false); t.value = vatFmt(num(t.value)); }
  save();
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset || {};
  if (t.id === "rsearch") { S.ui.rq = t.value; S.ui.rpg = 1; applyRFilter(); save(); return; }
  if (d.k != null && d.k !== "" && t.tagName === "INPUT") { S.v[d.k] = t.value; live(); save(); }
  else if (d.bs) { const [ln, i] = d.bs.split(":"); (S.bs[ln] = S.bs[ln] || [0, 0])[+i] = num(t.value); live(); save(); }
  else if (d.vat) {
    const [k, i] = d.vat.split(":");
    let x = t.value.replace(/[٠-٩]/g, c => AR_DIG.indexOf(c)).replace(/[٫]/g, ".").replace(/[^\d.,]/g, ""); if (x !== t.value) t.value = x;
    S.ui.vE = S.ui.vE || {};
    if (x.trim() === "") { S.ui.vE[d.vat] = S.ui.vE[d.vat] || "e"; (S.vat.rows[k] = S.vat.rows[k] || [0, 0])[+i] = 0; }
    else { delete S.ui.vE[d.vat]; vatMark(t, false); (S.vat.rows[k] = S.vat.rows[k] || [0, 0])[+i] = num(x); }
    live(); save();
  }
  else if (d.vf === "corr") {
    let x = t.value.replace(/[٠-٩]/g, c => AR_DIG.indexOf(c)).replace(/[^\d.,-]/g, "").replace(/(?!^)-/g, ""); if (x !== t.value) t.value = x;
    S.ui.vE = S.ui.vE || {};
    if (x.trim() === "" || x === "-") { S.ui.vE.corr = S.ui.vE.corr || "e"; S.vat.corr = 0; } else { delete S.ui.vE.corr; vatMark(t, false); S.vat.corr = num(x); }
    live(); save();
  }
  else if (d.vf === "cf") { S.vat.cf = num(t.value); live(); save(); }
  else if (d.vt) { S.vat[d.vt] = t.value; save(); }
  else if (d.wm && (d.wm === "name" || d.wm === "tin")) { S.wht[d.wm] = t.value; save(); }
  else if (d.wamt !== undefined) { S.wht.amt[d.wamt] = num(t.value); live(); save(); }
  else if (d.wrr !== undefined) { S.wht.rr[d.wrr] = t.value.trim() === "" ? "" : num(t.value); live(); save(); }
  else if (d.wcn !== undefined) { S.ui.wc = Object.assign({k: "mgmt"}, S.ui.wc, {net: num(t.value)}); live(); save(); }
  else if (d.info && !d.date && ["name", "tin"].includes(d.info)) { S.info[d.info] = t.value; save(); }
  else if (d.tp) { S.tp.amt = num(t.value); save(); }
  else if (d.note) { S.note = t.value; save(); }
  else if (d.d && DLG) {
    const [f, i] = d.d.split(":"), n = +i;
    if (DLG.t === "sched") DLG.rows[n][f] = f === "a" ? num(t.value) : t.value;
    else if (DLG.t === "fixed" || DLG.t === "adj") DLG.vals[n] = num(t.value);
    else if (DLG.t === "debt") DLG.rows[n][f] = f === "s" ? t.value : num(t.value);
    dlgTotals();
  } else if (d.otp != null) { if (t.value.length === 1) { const nx = $(`[data-otp="${+d.otp + 1}"]`); if (nx) nx.focus(); } }
});
document.addEventListener("toggle", e => { const el = e.target; if (el && el.classList && el.classList.contains("prof")) { S.ui.profOpen = el.open ? 1 : 0; return; } if (el && el.classList && el.classList.contains("dsec") && el.dataset.dk) { S.ui.dsec = S.ui.dsec || {}; S.ui.dsec[el.dataset.dk] = el.open ? 1 : 0; save(); return; } if (el && el.classList && el.classList.contains("acc") && el.dataset.ak) { S.ui.acc = S.ui.acc || {}; const v = el.open ? 1 : 0; if (S.ui.acc[el.dataset.ak] !== v) { S.ui.acc[el.dataset.ak] = v; save(); } } }, true);
$("#panel").addEventListener("click", e => { if (e.target === $("#panel")) $("#panel").classList.remove("open"); });

/* ===================== انتهاء الجلسة (رسالة تحاكي ما يظهر عند الخمول) ===================== */
let IDLE_T = null, IDLE_C = null;
function armIdle(){
  clearTimeout(IDLE_T);
  if (!S.flow || !S.flow.logged) return;
  IDLE_T = setTimeout(() => {
    if (!S.flow.logged || !$("#modal").hidden) return;
    let left = 120;
    const fmt = n => String(Math.floor(n / 60)).padStart(2, "0") + ":" + String(n % 60).padStart(2, "0");
    openModal(`<svg class="idle-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7.5v5.5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor"/></svg><h3>تنبيه</h3><p>حفاظاً على سرية معلوماتك، سيتم تسجيل خروجك من النظام بشكل تلقائي لعدم وجود أي نشاط بعد <span class="idle-t" id="idleT">${fmt(left)}</span> <span id="idleU">دقائق</span></p><div class="idle-b"><button type="button" class="btn" data-act="logout">تسجيل خروج</button><button type="button" class="btn primary" data-act="idleStay">البقاء متصلاً</button></div>`, "idle");
    clearInterval(IDLE_C);
    IDLE_C = setInterval(() => {
      left--; const el = $("#idleT");
      if (!el) { clearInterval(IDLE_C); return; }
      if (left <= 0) { clearInterval(IDLE_C); ACT.logout(); return; }
      el.textContent = fmt(left); const u = $("#idleU"); if (u) u.textContent = left >= 60 ? "دقائق" : "ثوانٍ";
    }, 1000);
  }, 15 * 60 * 1000);
}
["click", "keydown", "input", "change"].forEach(ev => document.addEventListener(ev, armIdle, true));

/* ===================== التشغيل ===================== */
Object.assign(ACT, ACT_TOOLS);
try { if (/[?&]admin=1\b/.test(location.search)) document.getElementById("jsonBtn").hidden = false; } catch (e) {}
render(); armIdle(); renderAlerts(); setInterval(renderAlerts, 36e5);

</script>
